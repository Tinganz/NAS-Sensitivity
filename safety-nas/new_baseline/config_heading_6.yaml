# Heading prediction -- arch 6
data:
  train_path: "safety-nas/datasets/combined_all.npz"
  target_col: "heading_error"
  batch_size: 128
  num_workers: 8
  val_split: 0.1
  pin_memory: true
  prefetch_factor: 2

training:
  max_epochs: 50
  lr: 5e-3
  optimizer: sgd
  weight_decay: 1e-4
  early_stopping_patience: 5
  lr_patience: 3
  auto_lr_find: false
  resume: true
  precision: "32"
  gradient_clip_val: 1.0
  profiler: null

model:
  arch_id: 6

artifacts:
  model_dir: safety-nas/new_baseline/models